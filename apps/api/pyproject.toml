[project]
name = "bullsutra"
version = "0.1.0"
description = "BullSutra: Multi-agent stock research assistant for NEPSE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sse-starlette>=2.0.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "nepsepy>=1.0.4",
    "jinja2>=3.1.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "reportlab>=4.0.0",
    "weasyprint>=60.0.0",
    "sentry-sdk>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
