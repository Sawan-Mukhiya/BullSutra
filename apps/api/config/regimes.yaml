regimes:
  - id: regime_1
    start: 1900-01-01
    end: 2026-04-05
    trading_days: [SUN, MON, TUE, WED, THU]
    week_start: SUN
    stock_limit_pct: 10
    preopen_limit_pct: 2
    order_band_pct: 2
    mkt_breaker_id: old_v1
    after_market_orders: false
  - id: regime_2
    start: 2026-04-06
    end: 2026-04-19
    trading_days: [MON, TUE, WED, THU, FRI]
    week_start: MON
    stock_limit_pct: 10
    preopen_limit_pct: 2
    order_band_pct: 2
    mkt_breaker_id: old_v1
    after_market_orders: false
  - id: regime_3
    start: 2026-04-20
    end: 2999-12-31
    trading_days: [MON, TUE, WED, THU, FRI]
    week_start: MON
    stock_limit_pct: 15
    preopen_limit_pct: 5
    order_band_pct: 3
    mkt_breaker_id: new_v2
    after_market_orders: true
breakers:
  old_v1:
    - {window: first_hour,  move_pct: 4, action: halt, minutes: 20}
    - {window: second_hour, move_pct: 5, action: halt, minutes: 40}
    - {window: any_time,    move_pct: 6, action: close_for_day}
  new_v2:
    - {window: first_2_hours, move_pct: 5, action: halt, minutes: 15}
    - {window: any_time,      move_pct: 8, action: close_for_day}
